name: Update Verfuegbarkeit

on:
  repository_dispatch:
    types: [update-verfuegbarkeit]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Datei schreiben
        run: |
          echo "${{ github.event.client_payload.content_b64 }}" | base64 -d > verfuegbarkeit.json

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add verfuegbarkeit.json
          git diff --staged --quiet || git commit -m "Automatisches Update: Verfuegbarkeit"
          git push
